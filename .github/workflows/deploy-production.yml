name: Deploy ProQPay Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proqpay-production
  cancel-in-progress: false

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Cloudflare native preflight
        run: npm run cloudflare:preflight

      - name: Build
        run: npm run build

      - name: Stamp reviewed release
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('out/release.json', JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,builtAt:new Date().toISOString()},null,2))"

      - name: Verify Cloudflare credentials
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=proqpay-lite --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production convergence
        shell: bash
        env:
          TARGET_URL: https://proqpay.msg-os.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl -fsS "$TARGET_URL/release.json" 2>/dev/null || true)"
            commit="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).commit||''))}catch{}})")"
            if [[ "$commit" == "$GITHUB_SHA" ]]; then
              echo "Production converged to $GITHUB_SHA"
              curl -fsS "$TARGET_URL/api/health" >/dev/null
              exit 0
            fi
            echo "Waiting for production convergence ($attempt/60), current=${commit:-unknown}"
            sleep 5
          done
          echo "::error::Production did not converge to $GITHUB_SHA"
          exit 1

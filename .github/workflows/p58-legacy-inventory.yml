name: P5.8 Read-Only Legacy Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE || 'proqpay-lite-production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify remote production access
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler whoami >/dev/null
      - name: Read-only aggregate inventory (NO mutation)
        run: |
          set -euo pipefail
          for part in a b; do
            set +e
            npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --json --command "$(sed '/^--/d' ops/p58-legacy-inventory-${part}.sql)" > "/tmp/p58-${part}.json" 2> "/tmp/p58-${part}-err.log"
            command_status=$?
            set -e
            if [ "$command_status" -ne 0 ]; then
              node scripts/p58-sanitize-d1-error.mjs "/tmp/p58-${part}-err.log" "/tmp/p58-${part}.json"
              exit "$command_status"
            fi
          done
          node scripts/p58-validate-inventory.mjs /tmp/p58-a.json /tmp/p58-b.json /tmp/p58-safe-report.json
      - name: Upload aggregated redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: p58-aggregate-inventory-${{ github.run_id }}
          path: /tmp/p58-safe-report.json
          if-no-files-found: error
          retention-days: 14

name: Security D1 Backup & Restore Drill

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proqpay-security-backup
  cancel-in-progress: false

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          npx wrangler whoami

      - name: Export production D1
        run: npx wrangler d1 export proqpay-lite-production --remote --output=/tmp/proqpay-daily.sql --skip-confirmation

      - name: Restore and integrity drill
        run: node scripts/verify-d1-backup.mjs /tmp/proqpay-daily.sql

      - name: Compress backup
        run: gzip -9 -c /tmp/proqpay-daily.sql > /tmp/proqpay-daily.sql.gz

      - name: Preserve verified backup and evidence
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-d1-security-backup-${{ github.run_id }}
          path: |
            /tmp/proqpay-daily.sql.gz
            /tmp/proqpay-backup-verification.json
          retention-days: 90

name: Reset Overseas Aug 2026 Pay Run Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reset-overseas-payrun-once.yml']

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve target pay run
        shell: bash
        run: |
          npx wrangler d1 execute proqpay-lite-production --remote --json --command="
            SELECT s.id,s.state,s.period,s.client_id,c.name AS client_name,
                   (SELECT COUNT(*) FROM payment_instructions pi WHERE pi.submission_id=s.id) AS pi_count
            FROM payroll_submissions s
            JOIN clients c ON c.id=s.client_id
            WHERE s.period='2026-08' AND LOWER(c.name) LIKE '%overseas global group%'
            ORDER BY s.created_at DESC;" > /tmp/target.json
          cat /tmp/target.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/target.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          if(rows.length!==1){
            console.error(`Expected exactly 1 Overseas 2026-08 pay run, found ${rows.length}`);
            process.exit(1);
          }
          fs.writeFileSync('/tmp/submission-id', String(rows[0].id));
          console.log('Target:', rows[0]);
          NODE

      - name: Guard financial history
        shell: bash
        run: |
          sid="$(cat /tmp/submission-id)"
          npx wrangler d1 execute proqpay-lite-production --remote --json --command="
            SELECT
              (SELECT COUNT(*) FROM payment_instructions pi
                WHERE pi.submission_id='$sid'
                  AND UPPER(pi.status) IN ('APPROVED_FOR_PAYMENT','DISBURSEMENT_PROCESSING','PROOF_UPLOADED','RECONCILIATION','PAYMENT_EXCEPTION','COMPLETED')) AS advanced_pi,
              (SELECT COUNT(*) FROM payment_proofs pp JOIN payment_instructions pi ON pi.id=pp.payment_instruction_id WHERE pi.submission_id='$sid') AS proofs,
              (SELECT COUNT(*) FROM reconciliations r JOIN payment_instructions pi ON pi.id=r.payment_instruction_id WHERE pi.submission_id='$sid') AS reconciliations,
              (SELECT COUNT(*) FROM invoices i JOIN payment_instructions pi ON pi.id=i.payment_instruction_id WHERE pi.submission_id='$sid') AS invoices;" > /tmp/guard.json
          cat /tmp/guard.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/guard.json','utf8'));
          const row=raw.flatMap(x=>x.results||[])[0]||{};
          const unsafe=['advanced_pi','proofs','reconciliations','invoices'].some(k=>Number(row[k]||0)>0);
          if(unsafe){ console.error('Abort: financial downstream artifacts already exist', row); process.exit(1); }
          NODE

      - name: Reset PI workflow only
        shell: bash
        run: |
          sid="$(cat /tmp/submission-id)"
          npx wrangler d1 execute proqpay-lite-production --remote --json --command="
            UPDATE payment_instructions
               SET status='REJECTED', updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
             WHERE submission_id='$sid'
               AND UPPER(status) IN ('DRAFT','PAYMENT_INSTRUCTION_READY','PAYMENT_APPROVAL_PENDING','REVISION_REQUIRED');

            UPDATE payroll_submissions
               SET state='CONTROLLER_REVIEW',
                   controller_reviewed_at=NULL,
                   controller_reviewed_by=NULL,
                   controller_review_note=NULL,
                   updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
             WHERE id='$sid';

            INSERT INTO audit_logs(id,org_id,username,role,action,detail,entity,entity_id)
            SELECT 'AUD-' || lower(hex(randomblob(16))), org_id, 'system-reset', 'SYSTEM',
                   'OVERSEAS_PAYRUN_WORKFLOW_RESET',
                   'Authorized reset to CONTROLLER_REVIEW; payroll snapshot preserved; early PI artifacts rejected',
                   'payroll_submission', id
              FROM payroll_submissions WHERE id='$sid';

            SELECT s.id,s.state,s.period,c.name AS client_name,
                   (SELECT COUNT(*) FROM payment_instructions pi WHERE pi.submission_id=s.id AND pi.status<>'REJECTED') AS active_pi_count,
                   (SELECT COUNT(*) FROM payroll_run_lines l WHERE l.submission_id=s.id AND l.included=1) AS payroll_lines
              FROM payroll_submissions s JOIN clients c ON c.id=s.client_id WHERE s.id='$sid';" > /tmp/result.json
          cat /tmp/result.json

      - name: Remove one-off workflow
        run: |
          rm .github/workflows/reset-overseas-payrun-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/reset-overseas-payrun-once.yml
          git commit -m 'chore: remove Overseas pay run reset workflow'
          git push origin HEAD:main

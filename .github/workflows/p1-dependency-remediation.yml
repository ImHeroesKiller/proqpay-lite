name: P1 Dependency Remediation
on:
  push:
    branches: [feat/p1-security-governance-ops]
    paths: ['.github/workflows/p1-dependency-remediation.yml']
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-security-governance-ops
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Upgrade vulnerable production packages
        run: npm install --save-exact next@16.3.6 sharp@0.35.5
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): remediate critical production dependencies"
          git push origin HEAD:feat/p1-security-governance-ops

name: Security Edge WAF Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-edge-waf.yml'
      - 'scripts/cloudflare-waf-closure.mjs'
      - 'docs/SECURITY_IDENTITY_EDGE_P2_1.md'
  schedule:
    - cron: "13 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: proqpay-security-edge-waf
  cancel-in-progress: false

jobs:
  waf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WAF_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROQPAY_CUSTOM_DOMAIN: ${{ vars.PROQPAY_CUSTOM_DOMAIN || 'proqpay.msg-os.com' }}
      CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME || 'msg-os.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify dedicated WAF token presence
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_WAF_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_WAF_API_TOKEN is not configured. Create a token scoped to msg-os.com with Zone Read + Zone WAF Read + Zone WAF Edit."
            exit 1
          fi
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Verify or deploy managed WAF
        run: node scripts/cloudflare-waf-closure.mjs

      - name: Preserve WAF closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-waf-closure-${{ github.run_id }}
          path: /tmp/proqpay-waf-closure.json
          retention-days: 90
          if-no-files-found: warn

      - name: Open or update WAF closure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title='SECURITY: Cloudflare WAF closure requires action';
            const {data}=await github.rest.issues.listForRepo({
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            });
            const existing=data.find((issue)=>issue.title===title);
            const body=[
              'P2.1 custom-domain identity controls can deploy independently, but Cloudflare WAF closure is not yet verified.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Required GitHub Actions secret: CLOUDFLARE_WAF_API_TOKEN',
              'Required Cloudflare token scope on zone msg-os.com: Zone Read + Zone WAF Read + Zone WAF Edit.',
              '',
              'Do not paste the token into this issue.'
            ].join('\n');
            if(existing){
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            }else{
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['security']}).catch(async()=>{
                await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
              });
            }

      - name: Close recovered WAF closure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title='SECURITY: Cloudflare WAF closure requires action';
            const {data}=await github.rest.issues.listForRepo({
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            });
            const existing=data.find((issue)=>issue.title===title);
            if(existing){
              await github.rest.issues.createComment({
                owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,
                body:`Cloudflare WAF closure verified at ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({
                owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'
              });
            }

name: Cloudflare Production Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-preflight.yml"
      - "migrations/**"
      - "ops/**"
      - "scripts/cloudflare-native-preflight.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-preflight
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify credential names are configured
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Required GitHub secret names are present."

      - name: Repository preflight
        run: npm run cloudflare:preflight

      - name: Verify Wrangler authentication
        run: |
          npx wrangler --version
          npx wrangler whoami

      - name: Inventory D1
        shell: bash
        run: |
          npx wrangler d1 list --json | tee /tmp/proqpay-d1.json
          grep -q 'proqpay-lite-production' /tmp/proqpay-d1.json || { echo "Expected D1 database not found"; exit 1; }

      - name: Inventory R2
        shell: bash
        run: |
          npx wrangler r2 bucket list | tee /tmp/proqpay-r2.txt
          grep -q 'proqpay-lite-files' /tmp/proqpay-r2.txt || { echo "Expected R2 bucket not found"; exit 1; }

      - name: Inventory Pages and rollback target
        shell: bash
        run: |
          npx wrangler pages project list --json | tee /tmp/proqpay-pages.json
          grep -q 'proqpay-lite' /tmp/proqpay-pages.json || { echo "Expected Pages project not found"; exit 1; }
          npx wrangler pages deployment list --project-name=proqpay-lite --environment=production --json | tee /tmp/proqpay-deployments.json

      - name: Verify production bindings and variables
        shell: bash
        run: |
          npx wrangler pages download config proqpay-lite --force
          config_file=""
          for candidate in wrangler.jsonc wrangler.json wrangler.toml; do
            if [ -f "$candidate" ]; then config_file="$candidate"; break; fi
          done
          test -n "$config_file" || { echo "Downloaded Pages config not found"; exit 1; }
          grep -Eq 'binding[^A-Za-z0-9]+DB|binding[[:space:]]*=[[:space:]]*"DB"' "$config_file" || { echo "DB binding missing"; exit 1; }
          grep -Eq 'binding[^A-Za-z0-9]+FILES|binding[[:space:]]*=[[:space:]]*"FILES"' "$config_file" || { echo "FILES binding missing"; exit 1; }
          grep -Eq 'binding[^A-Za-z0-9]+AI|binding[[:space:]]*=[[:space:]]*"AI"' "$config_file" || { echo "AI binding missing"; exit 1; }
          grep -q 'DEFAULT_ORG_ID' "$config_file" || { echo "DEFAULT_ORG_ID missing"; exit 1; }
          grep -q 'ORG-OTSINDO' "$config_file" || { echo "DEFAULT_ORG_ID has unexpected value"; exit 1; }
          grep -q 'DATA_BACKEND' "$config_file" || { echo "DATA_BACKEND missing"; exit 1; }
          grep -q 'd1' "$config_file" || { echo "DATA_BACKEND is not d1"; exit 1; }

      - name: Verify required Pages secret by name
        shell: bash
        run: |
          npx wrangler pages secret list --project-name=proqpay-lite | tee /tmp/proqpay-secret-names.txt
          grep -q 'PI_ENCRYPTION_KEY' /tmp/proqpay-secret-names.txt || { echo "PI_ENCRYPTION_KEY secret name missing"; exit 1; }

      - name: Preflight summary
        run: |
          echo "Cloudflare production inventory passed."
          echo "No resource, binding, secret, database, or deployment was modified."

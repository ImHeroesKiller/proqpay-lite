name: P5.8.4 UAT Archive Integrity (Read-Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE || 'proqpay-lite-production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify read-only Cloudflare D1 connection
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler whoami >/dev/null
      - name: Verify administrative UAT closure and financial non-replay
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --json --command "$(sed '/^--/d' ops/p584-uat-archive-verify.sql)" >/tmp/p584-audit-raw.json
          node scripts/p584-verify-archive.mjs /tmp/p584-audit-raw.json /tmp/p584-audit-safe.json
      - uses: actions/upload-artifact@v4
        with:
          name: p584-uat-archive-audit-${{ github.run_id }}
          path: /tmp/p584-audit-safe.json
          if-no-files-found: error
          retention-days: 14

name: P0 Security Production Cutover

on:
  push:
    branches: [main]
    paths:
      - 'scripts/security-production-cutover.mjs'
      - '.github/workflows/security-production-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proqpay-p0-security-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://proqpay-lite.pages.dev
      PROQPAY_UAT_EMAIL: ${{ secrets.PROQPAY_UAT_EMAIL }}
      PROQPAY_UAT_PASSWORD: ${{ secrets.PROQPAY_UAT_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate credentials
        shell: bash
        run: |
          test -n "${PROQPAY_UAT_EMAIL:-}" || { echo "::error::PROQPAY_UAT_EMAIL secret is missing"; exit 1; }
          test -n "${PROQPAY_UAT_PASSWORD:-}" || { echo "::error::PROQPAY_UAT_PASSWORD secret is missing"; exit 1; }

      - name: Wait for production health
        shell: bash
        run: |
          for attempt in {1..30}; do
            body="$(curl -fsS "$BASE_URL/api/health" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production health did not become ready"
          exit 1

      - name: Encrypt legacy employee bank accounts
        run: node scripts/security-production-cutover.mjs

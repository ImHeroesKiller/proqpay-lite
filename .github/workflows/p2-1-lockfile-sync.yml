name: P2.1 WebAuthn Lockfile Sync
on:
  push:
    branches: [feat/p2-1-identity-edge-closure]
    paths:
      - '.github/workflows/p2-1-lockfile-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-1-identity-edge-closure
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve reviewed WebAuthn dependency
        run: npm install --save-exact @simplewebauthn/server@14.0.3
      - name: Verify dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): lock WebAuthn server dependency"
          git push origin HEAD:feat/p2-1-identity-edge-closure

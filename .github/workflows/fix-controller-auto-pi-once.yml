name: Controller Auto PI Hotfix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-controller-auto-pi-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch controller approval into PI creation
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('functions/api/operating-model-d1.js')
          s = api.read_text()
          old = "if (!PROCESSOR_ROLES.has(actor.role)) return { status: 403, data: { error: 'Hanya Payroll Processor yang dapat membuat PI' } };"
          new = "if (!PROCESSOR_ROLES.has(actor.role) && !CONTROLLER_ROLES.has(actor.role)) return { status: 403, data: { error: 'Hanya Payroll Processor atau Payroll Controller yang dapat membuat PI' } };"
          assert old in s, 'PI role guard not found'
          s = s.replace(old, new, 1)
          api.write_text(s)

          ui = Path('src/components/OperatingWorkspace.tsx')
          s = ui.read_text()
          old = "if (['SUPER_ADMIN','PAYROLL_CONTROLLER'].includes(role) && row.state === 'PAYROLL_FINALIZED') return 'PAYMENT_INSTRUCTION_READY';\n    if (['SUPER_ADMIN','PAYROLL_PROCESSOR'].includes(role) && row.state === 'PAYMENT_INSTRUCTION_READY') return 'GENERATE_PAYMENT_INSTRUCTION';"
          new = "if (['SUPER_ADMIN','PAYROLL_CONTROLLER'].includes(role) && row.state === 'PAYROLL_FINALIZED') return 'PAYMENT_INSTRUCTION_READY';\n    if (['SUPER_ADMIN','PAYROLL_CONTROLLER','PAYROLL_PROCESSOR'].includes(role) && row.state === 'PAYMENT_INSTRUCTION_READY') return 'GENERATE_PAYMENT_INSTRUCTION';"
          assert old in s, 'PAYMENT_INSTRUCTION_READY role mapping not found'
          s = s.replace(old, new, 1)

          old = "CONTROLLER_REVIEW:'Setujui Data Payroll'"
          new = "CONTROLLER_REVIEW:'Setujui & Buat PI'"
          assert old in s, 'controller action label not found'
          s = s.replace(old, new, 1)

          old = "onClick={() => {const payload=next==='GENERATE_PAYMENT_INSTRUCTION'?{action:next,submissionId:selected.id}:next.startsWith('ADVANCE_')?{action:'ADVANCE_PAY_RUN',submissionId:selected.id,command:next==='ADVANCE_VALIDATE'?'VALIDATE':next==='ADVANCE_FINALIZE'?'FINALIZE_PAYROLL':'VALIDATE',reviewConfirmed:true,reviewNote:reviewNote||undefined}:selected.state==='CONTROLLER_REVIEW'?{action:'TRANSITION_SUBMISSION',submissionId:selected.id,toState:next,reviewConfirmed:true,reviewNote:reviewNote||undefined}:{action:'TRANSITION_SUBMISSION',submissionId:selected.id,toState:next};void act(payload,next==='GENERATE_PAYMENT_INSTRUCTION'?'Payment Instruction draft berhasil dibuat':`${actionName(selected.state)} berhasil`).then(()=>setSelected(null));}}"
          new = "onClick={() => {if(selected.state==='CONTROLLER_REVIEW'){void (async()=>{try{await executeOperatingAction({action:'TRANSITION_SUBMISSION',submissionId:selected.id,toState:'DATA_APPROVED',reviewConfirmed:true,reviewNote:reviewNote||undefined});await executeOperatingAction({action:'TRANSITION_SUBMISSION',submissionId:selected.id,toState:'PAYMENT_INSTRUCTION_READY'});await executeOperatingAction({action:'GENERATE_PAYMENT_INSTRUCTION',submissionId:selected.id});await act({},'Data payroll disetujui dan Payment Instruction draft berhasil dibuat');setSelected(null);}catch(error){await load();throw error;}})().catch((error)=>window.alert(error instanceof Error?error.message:'Approval / pembuatan PI gagal'));return;}const payload=next==='GENERATE_PAYMENT_INSTRUCTION'?{action:next,submissionId:selected.id}:next.startsWith('ADVANCE_')?{action:'ADVANCE_PAY_RUN',submissionId:selected.id,command:next==='ADVANCE_VALIDATE'?'VALIDATE':next==='ADVANCE_FINALIZE'?'FINALIZE_PAYROLL':'VALIDATE',reviewConfirmed:true,reviewNote:reviewNote||undefined}:{action:'TRANSITION_SUBMISSION',submissionId:selected.id,toState:next};void act(payload,next==='GENERATE_PAYMENT_INSTRUCTION'?'Payment Instruction draft berhasil dibuat':`${actionName(selected.state)} berhasil`).then(()=>setSelected(null));}}"
          assert old in s, 'controller button handler not found'
          s = s.replace(old, new, 1)
          ui.write_text(s)

          test = Path('tests/pi-workflow-ui.test.mjs')
          ts = test.read_text()
          block = """

test('Controller approval creates Payment Instruction in one action', () => {
  assert.match(ui, /CONTROLLER_REVIEW:'Setujui & Buat PI'/);
  assert.match(ui, /toState:'DATA_APPROVED'[\\s\\S]*?toState:'PAYMENT_INSTRUCTION_READY'[\\s\\S]*?GENERATE_PAYMENT_INSTRUCTION/);
  assert.match(ui, /PAYROLL_CONTROLLER','PAYROLL_PROCESSOR'[\\s\\S]*?PAYMENT_INSTRUCTION_READY/);
});
"""
          if 'Controller approval creates Payment Instruction in one action' not in ts:
              test.write_text(ts + block)
          PY
      - name: Verify targeted tests
        run: node --test tests/pi-workflow-ui.test.mjs
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/fix-controller-auto-pi-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/operating-model-d1.js src/components/OperatingWorkspace.tsx tests/pi-workflow-ui.test.mjs .github/workflows/fix-controller-auto-pi-once.yml
          git commit -m 'fix: create PI from controller approval'
          git push origin HEAD:main

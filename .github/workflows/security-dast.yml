name: Security DAST Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/security-dast.yml'
      - 'scripts/security-zap-gate.mjs'
      - 'functions/**'
      - 'public/_headers'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-dast.yml'
      - 'scripts/security-zap-gate.mjs'
      - 'functions/**'
      - 'public/_headers'
  schedule:
    - cron: "10 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: proqpay-security-dast
  cancel-in-progress: true

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://proqpay.msg-os.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for reviewed release convergence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            commit="$(curl -fsS "$TARGET_URL/release.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).commit||''))}catch{}})")"
            if [[ "$commit" == "$GITHUB_SHA" ]]; then
              echo "Production release converged to $GITHUB_SHA."
              exit 0
            fi
            echo "Production is still on ${commit:-unknown}; waiting for $GITHUB_SHA (attempt $attempt/120)."
            sleep 5
          done
          echo "::error::Production did not converge to reviewed commit $GITHUB_SHA."
          exit 1

      - name: Prepare ZAP workspace
        shell: bash
        run: |
          mkdir -p /tmp/zap
          chmod 777 /tmp/zap

      - name: OWASP ZAP passive baseline
        id: zap
        shell: bash
        run: |
          set +e
          docker run --rm             -v /tmp/zap:/zap/wrk/:rw             ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py               -t "$TARGET_URL"               -J zap-report.json               -w zap-report.md               -r zap-report.html               -I               -m 2
          code=$?
          echo "scanner_exit=$code" >> "$GITHUB_OUTPUT"
          test -s /tmp/zap/zap-report.json || { echo "ZAP JSON report missing"; exit 3; }
          if [ "$code" -eq 3 ]; then
            echo "ZAP scanner returned an operational error."
            exit 3
          fi

      - name: Gate High and Critical findings
        run: node scripts/security-zap-gate.mjs /tmp/zap/zap-report.json /tmp/zap/proqpay-dast-evidence.json

      - name: Preserve DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-security-dast-${{ github.run_id }}
          path: |
            /tmp/zap/zap-report.json
            /tmp/zap/zap-report.md
            /tmp/zap/zap-report.html
            /tmp/zap/proqpay-dast-evidence.json
          retention-days: 90
          if-no-files-found: warn

      - name: Track non-blocking Medium DAST findings
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const title='SECURITY BACKLOG: review Medium DAST findings';
            let evidence={counts:{medium:0},medium:[]};
            try{evidence=JSON.parse(fs.readFileSync('/tmp/zap/proqpay-dast-evidence.json','utf8'));}catch{}
            const {data}=await github.rest.issues.listForRepo({
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            });
            const existing=data.find((issue)=>issue.title===title);
            const medium=Number(evidence?.counts?.medium||0);
            if(medium>0){
              const names=(evidence.medium||[]).map((item)=>`- ${item.name} (risk ${item.riskCode}, count ${item.count})`).join('\n');
              const body=[
                'Production DAST has no High/Critical findings, but Medium findings remain for review.',
                '',
                names,
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'This issue is non-blocking for the P3 High/Critical gate but must remain visible in the security backlog.'
              ].join('\n');
              if(existing){
                await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
              }else{
                await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['security']}).catch(async()=>{
                  await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
                });
              }
            }else if(existing){
              await github.rest.issues.createComment({
                owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,
                body:`No Medium DAST findings remain as of ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'});
            }

      - name: Open or update DAST issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title='SECURITY: DAST High/Critical finding requires review';
            const {data}=await github.rest.issues.listForRepo({
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            });
            const existing=data.find((issue)=>issue.title===title);
            const body=[
              'OWASP ZAP baseline or its assurance gate failed against the canonical production target.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the retained ZAP evidence. Do not paste secrets, credentials, or customer data into this issue.'
            ].join('\n');
            if(existing){
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            }else{
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['security']}).catch(async()=>{
                await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
              });
            }

      - name: Close recovered DAST issue
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title='SECURITY: DAST High/Critical finding requires review';
            const {data}=await github.rest.issues.listForRepo({
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            });
            const existing=data.find((issue)=>issue.title===title);
            if(existing){
              await github.rest.issues.createComment({
                owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,
                body:`DAST assurance recovered at ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({
                owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'
              });
            }

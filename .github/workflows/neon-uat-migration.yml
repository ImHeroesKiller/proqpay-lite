name: Neon to D1 UAT Data Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/neon-uat-migration.yml"
      - "scripts/migrate-neon-uat.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly: MIGRATE NEON UAT DATA TO D1 PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proqpay-neon-uat-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROQPAY_NEON_DATABASE_URL: ${{ secrets.PROQPAY_NEON_DATABASE_URL }}
    steps:
      - name: Require exact production confirmation
        env:
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          PUSH_CONFIRMATION: ${{ github.event.head_commit.message }}
        run: |
          provided="${DISPATCH_CONFIRMATION:-${PUSH_CONFIRMATION:-}}"
          test "$provided" = "MIGRATE NEON UAT DATA TO D1 PRODUCTION"

      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate credentials by presence
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "${PROQPAY_NEON_DATABASE_URL:-}" || { echo "PROQPAY_NEON_DATABASE_URL is missing"; exit 1; }
          npx wrangler whoami >/dev/null

      - name: Quality gates
        run: |
          npm run cloudflare:preflight
          npm test
          npm run typecheck

      - name: Export current D1 backup
        run: npx wrangler d1 export proqpay-lite-production --remote --output=/tmp/proqpay-d1-before-neon-uat.sql --skip-confirmation

      - name: Preserve rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-d1-before-neon-uat-${{ github.run_id }}
          path: /tmp/proqpay-d1-before-neon-uat.sql
          retention-days: 30

      - name: Read Neon and build canonical UAT import
        run: node scripts/migrate-neon-uat.mjs /tmp/proqpay-neon-uat.sql | tee /tmp/proqpay-neon-summary.json

      - name: Reject an empty or invalid source
        run: |
          node -e "const x=require('/tmp/proqpay-neon-summary.json'); if(!x.migration?.clients||!x.migration?.employees) { console.error(x); process.exit(1) }"
          ! grep -Eiq 'INSERT INTO (payments|approvals|payrolls)' /tmp/proqpay-neon-uat.sql

      - name: Import canonical UAT master data
        run: npx wrangler d1 execute proqpay-lite-production --remote --file=/tmp/proqpay-neon-uat.sql

      - name: Verify imported counts and constraints
        shell: bash
        run: |
          npx wrangler d1 execute proqpay-lite-production --remote --json --command="
            SELECT 'clients' AS metric, COUNT(*) AS value FROM clients
            UNION ALL SELECT 'projects', COUNT(*) FROM projects
            UNION ALL SELECT 'employees', COUNT(*) FROM employees
            UNION ALL SELECT 'primary_accounts', COUNT(*) FROM employee_bank_accounts WHERE is_primary=1;
          " | tee /tmp/proqpay-neon-d1-counts.json
          npx wrangler d1 execute proqpay-lite-production --remote --json --command="
            SELECT employee_id FROM employee_bank_accounts GROUP BY employee_id HAVING SUM(CASE WHEN is_primary=1 THEN 1 ELSE 0 END) > 1;
          " > /tmp/proqpay-neon-bank-violations.json
          node -e "const x=require('/tmp/proqpay-neon-bank-violations.json'); const rows=x.flatMap(v=>v.results||[]); if(rows.length){console.error(rows);process.exit(1)}"

      - name: Reconcile canonical payment invariants
        shell: bash
        run: |
          assert_sql="$(sed '/^[[:space:]]*--/d' ops/d1-cutover-assert.sql | tr '\n' ' ')"
          npx wrangler d1 execute proqpay-lite-production --remote --json --command="$assert_sql" > /tmp/proqpay-neon-assert.json
          node -e "const x=require('/tmp/proqpay-neon-assert.json'); const rows=x.flatMap(v=>v.results||[]); if(rows.length){console.error(rows);process.exit(1)}"

      - name: Remove transient source export
        if: always()
        run: rm -f /tmp/proqpay-neon-uat.sql /tmp/proqpay-neon-summary.json

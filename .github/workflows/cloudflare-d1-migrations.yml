name: Cloudflare D1 Reviewed Migrations

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-reviewed-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE || 'proqpay-lite-production' }}

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          npx wrangler whoami

      - name: Backup production D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 export "$D1_DATABASE_NAME" --remote --output=/tmp/proqpay-d1-backup.sql
          node scripts/verify-d1-backup.mjs /tmp/proqpay-d1-backup.sql

      - name: Resolve production D1 configuration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/proqpay-d1-list.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/proqpay-d1-list.json','utf8'));
          const target=String(process.env.D1_DATABASE_NAME||'').trim();
          const rows=Array.isArray(payload)?payload:(Array.isArray(payload?.result)?payload.result:[]);
          const row=rows.find((item)=>String(item?.name||item?.database_name||'').trim()===target);
          if(!row){
            console.error('Production D1 database not found: '+target);
            process.exit(1);
          }
          const databaseId=String(row.uuid||row.id||row.database_id||'').trim();
          if(!databaseId){
            console.error('Production D1 database id is missing for: '+target);
            process.exit(1);
          }
          const config={
            "$schema":"./node_modules/wrangler/config-schema.json",
            "name":"proqpay-lite-d1-migrations",
            "compatibility_date":"2026-08-21",
            "d1_databases":[{
              "binding":"DB",
              "database_name":target,
              "database_id":databaseId,
              "migrations_dir":"migrations"
            }]
          };
          fs.writeFileSync('wrangler-p56.json',JSON.stringify(config,null,2));
          console.log('Resolved reviewed D1 migration target: '+target);
          NODE

      - name: Apply reviewed migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler-p56.json

      - name: Verify P5.6 schema and routing trigger
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --json --command "SELECT name,type FROM sqlite_master WHERE name IN ('e2pay_disbursement_limit_requests','e2pay_disbursement_limit_usage','payment_instruction_provider_routing_immutable','payment_instruction_provider_snapshot_immutable') ORDER BY name;" > /tmp/proqpay-p56-schema.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/proqpay-p56-schema.json','utf8'));
          const rows=(Array.isArray(payload)?payload:[payload]).flatMap((item)=>Array.isArray(item?.results)?item.results:[]);
          const names=new Set(rows.map((row)=>String(row?.name||'')));
          const required=['e2pay_disbursement_limit_requests','e2pay_disbursement_limit_usage','payment_instruction_provider_routing_immutable'];
          const missing=required.filter((name)=>!names.has(name));
          if(missing.length){
            console.error('P5.6 schema verification failed. Missing: '+missing.join(', '));
            process.exit(1);
          }
          if(names.has('payment_instruction_provider_snapshot_immutable')){
            console.error('Legacy provider snapshot immutability trigger still exists.');
            process.exit(1);
          }
          console.log('P5.6 schema verified.');
          NODE

      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-d1-migration-evidence-${{ github.run_id }}
          path: |
            /tmp/proqpay-backup-verification.json
            /tmp/proqpay-p56-schema.json
            /tmp/proqpay-d1-list.json
          retention-days: 90
          if-no-files-found: warn
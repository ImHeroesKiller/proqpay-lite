name: Temporary Security Lockfile Remediation

on:
  push:
    branches:
      - feat/p1-security-operational-readiness
    paths:
      - '.github/workflows/security-remediate-lock.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/p1-security-operational-readiness

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install current lock
        run: npm ci

      - name: Apply compatible security fixes to lockfile
        run: npm audit fix --package-lock-only || true

      - name: Verify clean install and security audit
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit remediated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): remediate audited dependency vulnerabilities"
          git push origin HEAD:feat/p1-security-operational-readiness

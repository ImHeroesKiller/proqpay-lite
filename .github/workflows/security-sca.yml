name: Security Dependency & Vulnerability Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > /tmp/npm-audit.json
          code=$?
          cat /tmp/npm-audit.json
          exit "$code"

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-security-audit-${{ github.run_id }}
          path: /tmp/npm-audit.json
          retention-days: 90
          if-no-files-found: warn

      - name: Create or update vulnerability issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const title='SECURITY: dependency vulnerability requires remediation';
            const {data}=await github.rest.issues.listForRepo({
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            });
            const existing=data.find((issue)=>issue.title===title);
            const body=[
              'Automated npm audit detected at least one High/Critical dependency vulnerability.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Patch SLA: Critical <= 7 days; High <= 14 days. Do not include secrets or raw customer data in this issue.'
            ].join('\n');
            if(existing){
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            }else{
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['security']}).catch(async()=>{
                await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
              });
            }

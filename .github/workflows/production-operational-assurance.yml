name: Production Operational Assurance

on:
  schedule:
    - cron: "7 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: proqpay-production-operational-assurance
  cancel-in-progress: false

jobs:
  operational-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROQPAY_CUSTOM_DOMAIN: ${{ vars.PROQPAY_CUSTOM_DOMAIN || 'proqpay.msg-os.com' }}

    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run operational regression suite
        run: >
          node --test
          tests/post-rollout-audit-uat.test.mjs
          tests/e2pay-p3-operational-readiness.test.mjs
          tests/payment-proof-reconciliation-p2-hardening.test.mjs
          tests/p4-operational-closure.test.mjs

      - name: Wait for reviewed release convergence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            body="$(curl -sS "https://${PROQPAY_CUSTOM_DOMAIN}/release.json" 2>/dev/null || true)"
            commit="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).commit||''))}catch{}})")"
            if [[ "$commit" == "$GITHUB_SHA" ]]; then
              printf '%s' "$body" > /tmp/proqpay-release.json
              exit 0
            fi
            echo "Production is on ${commit:-unknown}; waiting for $GITHUB_SHA (${attempt}/120)."
            sleep 5
          done
          exit 1

      - name: Read production release marker
        if: github.event_name != 'push'
        run: curl --fail --silent --show-error "https://${PROQPAY_CUSTOM_DOMAIN}/release.json" > /tmp/proqpay-release.json

      - name: Verify production health and hardened headers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://${PROQPAY_CUSTOM_DOMAIN}/api/health" > /tmp/proqpay-health.json
          node -e "const x=require('/tmp/proqpay-health.json');if(x.ready!==true||x.database!=='d1'||x.auth_mode!=='session'||(x.checks||[]).some(v=>v.status==='error')){console.error(x);process.exit(1)}"
          curl --fail --silent --show-error -D /tmp/proqpay-root-headers.txt -o /dev/null "https://${PROQPAY_CUSTOM_DOMAIN}/"
          grep -qi '^content-security-policy:' /tmp/proqpay-root-headers.txt
          grep -qi "frame-ancestors 'none'" /tmp/proqpay-root-headers.txt
          grep -qi "object-src 'none'" /tmp/proqpay-root-headers.txt
          grep -qi '^strict-transport-security:' /tmp/proqpay-root-headers.txt
          grep -qi '^cross-origin-opener-policy:[[:space:]]*same-origin' /tmp/proqpay-root-headers.txt
          grep -qi '^cross-origin-resource-policy:[[:space:]]*same-origin' /tmp/proqpay-root-headers.txt
          csp="$(grep -i '^content-security-policy:' /tmp/proqpay-root-headers.txt)"
          ! printf '%s' "$csp" | grep -Eqi "(^|;[[:space:]]*)script-src[[:space:]][^;]*'unsafe-inline'"
          ! printf '%s' "$csp" | grep -Eqi "(^|;[[:space:]]*)style-src[[:space:]][^;]*'unsafe-inline'"

      - name: Verify anonymous APIs fail closed
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/me /api/operating-model /api/billing /api/payment-gateway; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://${PROQPAY_CUSTOM_DOMAIN}${path}")"
            [[ "$code" == "401" || "$code" == "403" ]] || { echo "$path returned $code"; exit 1; }
          done

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler whoami

      - name: Fresh production D1 recovery verification
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 export proqpay-lite-production --remote --output=/tmp/proqpay-p4-operational.sql --skip-confirmation
          node scripts/verify-d1-backup.mjs /tmp/proqpay-p4-operational.sql

      - name: Verify canonical production invariants
        shell: bash
        run: |
          set -euo pipefail
          reconcile_sql="$(sed '/^[[:space:]]*--/d' ops/d1-reconcile.sql | tr '\n' ' ')"
          assert_sql="$(sed '/^[[:space:]]*--/d' ops/d1-cutover-assert.sql | tr '\n' ' ')"
          npx wrangler d1 execute proqpay-lite-production --remote --command="$reconcile_sql" --json > /tmp/proqpay-reconcile.json
          npx wrangler d1 execute proqpay-lite-production --remote --command="$assert_sql" --json > /tmp/proqpay-assert.json
          node -e "const x=require('/tmp/proqpay-assert.json');const rows=(Array.isArray(x)?x:[]).flatMap(v=>v.results||[]);if(rows.length){console.error(rows);process.exit(1)}"

      - name: Collect operational workflow and issue evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{
              owner:context.repo.owner,repo:context.repo.repo,per_page:100
            });
            fs.writeFileSync('/tmp/proqpay-workflow-runs.json',JSON.stringify(runs,null,2));
            const issues=await github.paginate(github.rest.issues.listForRepo,{
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            });
            fs.writeFileSync('/tmp/proqpay-open-issues.json',JSON.stringify(issues.filter(x=>!x.pull_request),null,2));

      - name: Build production operational assurance evidence
        run: >
          node scripts/p4-operational-closure.mjs
          /tmp/proqpay-health.json
          /tmp/proqpay-release.json
          /tmp/proqpay-assert.json
          /tmp/proqpay-workflow-runs.json
          /tmp/proqpay-open-issues.json
          /tmp/proqpay-backup-verification.json
          /tmp/proqpay-p4-operational-closure.json

      - name: Preserve production operational assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-production-operational-assurance-${{ github.run_id }}
          path: |
            /tmp/proqpay-p4-operational-closure.json
            /tmp/proqpay-health.json
            /tmp/proqpay-release.json
            /tmp/proqpay-backup-verification.json
            /tmp/proqpay-reconcile.json
            /tmp/proqpay-assert.json
          if-no-files-found: warn
          retention-days: 90

      - name: Open or update production operational assurance incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title='OPS: production operational assurance failed';
            const {data}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=data.find(x=>x.title===title);
            const body=[
              'Automated production operational assurance failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Review retained operational evidence and the failing workflow step. Do not paste secrets or production customer data into this issue.'
            ].join('\n');
            if(existing) await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['security']}).catch(()=>github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body}));

      - name: Close recovered production operational assurance incident
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title='OPS: production operational assurance failed';
            const {data}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=data.find(x=>x.title===title);
            if(existing){
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body:`Production operational assurance recovered at ${new Date().toISOString()}.`});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'});
            }

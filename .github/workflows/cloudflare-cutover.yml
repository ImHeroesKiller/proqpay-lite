name: Cloudflare Database Cutover

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly: PROVISION PROQPAY D1 PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-database-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROQPAY_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.PROQPAY_BOOTSTRAP_ADMIN_EMAIL }}
      PROQPAY_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.PROQPAY_BOOTSTRAP_ADMIN_PASSWORD }}
      PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'proqpay-lite' }}
    steps:
      - name: Require exact production confirmation
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "PROVISION PROQPAY D1 PRODUCTION" || {
            echo "Exact production confirmation is required."
            exit 1
          }

      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run cloudflare:preflight
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Verify Cloudflare authentication
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "${PROQPAY_BOOTSTRAP_ADMIN_EMAIL:-}" || { echo "PROQPAY_BOOTSTRAP_ADMIN_EMAIL is missing"; exit 1; }
          test -n "${PROQPAY_BOOTSTRAP_ADMIN_PASSWORD:-}" || { echo "PROQPAY_BOOTSTRAP_ADMIN_PASSWORD is missing"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:xdigit:]]{32}$ ]] || {
            echo "CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID, not a zone ID or token ID."
            exit 1
          }
          npx wrangler --version
          npx wrangler whoami

      - name: Verify Pages project and record rollback target
        shell: bash
        run: |
          pages_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          project_status=$(curl --silent --show-error \
            --output /tmp/proqpay-pages-project.json \
            --write-out "%{http_code}" \
            --header "$auth_header" \
            "${pages_api}/${PAGES_PROJECT_NAME}")

          if [ "$project_status" != "200" ]; then
            echo "Pages project lookup failed with HTTP ${project_status}."
            case "$project_status" in
              401|403)
                echo "Token cannot read Pages. Add Account > Cloudflare Pages > Read (and Edit for deploy/rollback), scoped to the account that owns the project."
                ;;
              404)
                echo "Project '${PAGES_PROJECT_NAME}' is not visible in the configured account. Checking visible project names..."
                ;;
              *)
                echo "Cloudflare Pages API returned an unexpected response."
                ;;
            esac

            list_status=$(curl --silent --show-error \
              --output /tmp/proqpay-pages-list.json \
              --write-out "%{http_code}" \
              --header "$auth_header" \
              "${pages_api}?per_page=100")
            if [ "$list_status" = "200" ]; then
              node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/proqpay-pages-list.json', 'utf8'));
          const names = Array.isArray(payload.result)
            ? payload.result.map((project) => project.name).filter(Boolean)
            : [];
          console.log(names.length
            ? `Pages projects visible to this token/account: ${names.join(', ')}`
            : 'No Pages projects are visible to this token/account.');
          NODE
              echo "If the project appears above under another name, set repository variable CLOUDFLARE_PAGES_PROJECT to that exact name. Otherwise replace CLOUDFLARE_ACCOUNT_ID with the Account ID shown on that Pages project's dashboard."
            else
              echo "Pages project inventory also failed with HTTP ${list_status}; verify the token account scope and Pages permissions."
            fi
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/proqpay-pages-project.json', 'utf8'));
          if (payload.success !== true || payload.result?.name !== process.env.PAGES_PROJECT_NAME) {
            console.error('Pages project response did not match the requested project.');
            process.exit(1);
          }
          console.log(`Verified Pages project: ${payload.result.name}`);
          NODE

          deployment_status=$(curl --silent --show-error \
            --output /tmp/proqpay-deployments.json \
            --write-out "%{http_code}" \
            --header "$auth_header" \
            "${pages_api}/${PAGES_PROJECT_NAME}/deployments?env=production&per_page=25")
          test "$deployment_status" = "200" || {
            echo "Production deployment lookup failed with HTTP ${deployment_status}."
            exit 1
          }

          rollback_id=$(node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/proqpay-deployments.json', 'utf8'));
          const deployments = Array.isArray(payload.result) ? payload.result : [];
          const candidate = deployments.find((row) =>
            row?.id &&
            row?.environment === 'production' &&
            (!row?.latest_stage?.status || row.latest_stage.status === 'success')
          );
          if (!candidate) {
            console.error('No successful production deployment is available as a rollback target.');
            process.exit(1);
          }
          process.stdout.write(candidate.id);
          NODE
          )
          echo "ROLLBACK_DEPLOYMENT_ID=$rollback_id" >> "$GITHUB_ENV"
          echo "Rollback target recorded for ${PAGES_PROJECT_NAME}."

      - name: Verify required Pages secret by name
        shell: bash
        run: |
          npx wrangler pages secret list --project-name="$PAGES_PROJECT_NAME" > /tmp/proqpay-secret-names.txt
          grep -q 'PI_ENCRYPTION_KEY' /tmp/proqpay-secret-names.txt || { echo "PI_ENCRYPTION_KEY secret name missing"; exit 1; }

      - name: Provision dedicated D1 when absent
        shell: bash
        run: |
          npx wrangler d1 list --json > /tmp/proqpay-d1.json
          if ! grep -q 'proqpay-lite-production' /tmp/proqpay-d1.json; then
            npx wrangler d1 create proqpay-lite-production --location apac
            npx wrangler d1 list --json > /tmp/proqpay-d1.json
          fi
          d1_id=$(node -e "const x=require('/tmp/proqpay-d1.json'); const row=x.find(v=>v.name==='proqpay-lite-production'); if(!row?.uuid) process.exit(1); process.stdout.write(row.uuid)")
          echo "D1_DATABASE_ID=$d1_id" >> "$GITHUB_ENV"

      - name: Provision private R2 bucket when absent
        shell: bash
        run: |
          if ! npx wrangler r2 bucket info proqpay-lite-files --json > /tmp/proqpay-r2.json 2>/dev/null; then
            npx wrangler r2 bucket create proqpay-lite-files --location apac
            npx wrangler r2 bucket info proqpay-lite-files --json > /tmp/proqpay-r2.json
          fi

      - name: Validate resumable D1 state
        shell: bash
        run: |
          npx wrangler d1 execute proqpay-lite-production --remote \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE '_cf_%' ORDER BY name" \
            --json > /tmp/proqpay-d1-inventory.json
          node scripts/validate-d1-cutover-state.mjs /tmp/proqpay-d1-inventory.json

      - name: Export pre-migration D1 backup
        run: npx wrangler d1 export proqpay-lite-production --remote --output=/tmp/proqpay-pre-migration.sql --skip-confirmation

      - name: Preserve pre-migration backup
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-d1-pre-migration-${{ github.run_id }}
          path: /tmp/proqpay-pre-migration.sql
          retention-days: 30

      - name: Download and prepare current Pages configuration
        shell: bash
        run: |
          npx wrangler pages download config "$PAGES_PROJECT_NAME" --force
          config_file=""
          for candidate in wrangler.jsonc wrangler.json wrangler.toml; do
            if [ -f "$candidate" ]; then config_file="$candidate"; break; fi
          done
          test -n "$config_file" || { echo "Downloaded Pages config was not generated"; exit 1; }
          echo "Downloaded Pages config: ${config_file}"
          node scripts/prepare-pages-config.mjs "$D1_DATABASE_ID"
          grep -q '"binding": "DB"' wrangler.jsonc
          grep -q '"binding": "FILES"' wrangler.jsonc
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '"AUTH_MODE": "session"' wrangler.jsonc

      - name: Apply canonical D1 migration
        run: npx wrangler d1 migrations apply proqpay-lite-production --remote

      - name: Bootstrap the first production Super Admin safely
        shell: bash
        run: |
          node scripts/prepare-bootstrap-admin.mjs /tmp/proqpay-bootstrap-admin.sql
          npx wrangler d1 execute proqpay-lite-production --remote --file=/tmp/proqpay-bootstrap-admin.sql
          npx wrangler d1 execute proqpay-lite-production --remote --command="SELECT COUNT(*) AS n FROM app_users WHERE role='SUPER_ADMIN' AND status='ACTIVE'" --json > /tmp/proqpay-active-admin.json
          active_admins=$(node -e "const x=require('/tmp/proqpay-active-admin.json'); const rows=(Array.isArray(x)?x:[]).flatMap(v=>v.results||[]); process.stdout.write(String(rows[0]?.n ?? 0))")
          test "$active_admins" -ge 1 || { echo "No active Super Admin exists; refusing production deployment"; exit 1; }
          echo "Active production Super Admin gate passed."

      - name: Reconcile canonical database
        shell: bash
        run: |
          reconcile_sql="$(sed '/^[[:space:]]*--/d' ops/d1-reconcile.sql | tr '\n' ' ')"
          assert_sql="$(sed '/^[[:space:]]*--/d' ops/d1-cutover-assert.sql | tr '\n' ' ')"
          npx wrangler d1 execute proqpay-lite-production --remote --command="$reconcile_sql" --json | tee /tmp/proqpay-reconcile.json
          npx wrangler d1 execute proqpay-lite-production --remote --command="$assert_sql" --json > /tmp/proqpay-assert.json
          node -e "const x=require('/tmp/proqpay-assert.json'); const rows=(Array.isArray(x)?x:[]).flatMap(v=>v.results||[]); if(rows.length){console.error(rows);process.exit(1)}; console.log('D1 cutover assertions passed')"

      - name: Deploy reviewed main with production bindings
        id: deploy
        run: npx wrangler pages deploy out --project-name="$PAGES_PROJECT_NAME" --branch=main --commit-hash="${{ github.sha }}"

      - name: Verify production health
        id: health
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://proqpay-lite.pages.dev/api/health > /tmp/proqpay-health.json; then
              if node -e "const x=require('/tmp/proqpay-health.json'); if(x.ready!==true||x.database!=='d1') process.exit(1)"; then
                cat /tmp/proqpay-health.json
                exit 0
              fi
            fi
            sleep 10
          done
          cat /tmp/proqpay-health.json 2>/dev/null || true
          exit 1

      - name: Roll back Pages after failed deployment acceptance
        if: failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure'
        shell: bash
        run: |
          curl --fail --silent --show-error --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT_NAME}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}'

      - name: Cutover summary
        if: success()
        run: |
          echo "Cloudflare D1 migration, reconciliation, Pages deployment, and health check passed."
          echo "Production database: proqpay-lite-production"
          echo "Production Pages project: ${PAGES_PROJECT_NAME}"

name: Cloudflare Pages Production Deploy

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'proqpay-lite' }}
      PROQPAY_UAT_EMAIL: ${{ secrets.PROQPAY_UAT_EMAIL }}
      PROQPAY_UAT_PASSWORD: ${{ secrets.PROQPAY_UAT_PASSWORD }}
      PROQPAY_CUSTOM_DOMAIN: ${{ vars.PROQPAY_CUSTOM_DOMAIN || 'proqpay.msg-os.com' }}
      CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME || 'msg-os.com' }}

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Manual-dispatch quality gates
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Cloudflare native preflight
        run: npm run cloudflare:preflight

      - name: Stamp reviewed release
        shell: bash
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' "$RELEASE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/release.json

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          npx wrangler whoami

      - name: Close custom domain and WAF controls
        shell: bash
        run: node scripts/cloudflare-edge-closure.mjs

      - name: Preserve edge closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-edge-closure-${{ github.run_id }}
          path: /tmp/proqpay-edge-closure.json
          retention-days: 90
          if-no-files-found: warn


      - name: Prepare production Pages and D1 configuration
        shell: bash
        run: |
          npx wrangler d1 list --json > /tmp/proqpay-d1.json
          d1_id=$(node -e "const x=require('/tmp/proqpay-d1.json');const row=x.find(v=>v.name==='proqpay-lite-production');if(!row?.uuid)process.exit(1);process.stdout.write(row.uuid)")
          npx wrangler pages download config "$PAGES_PROJECT_NAME" --force
          config_file=""
          for candidate in wrangler.jsonc wrangler.json wrangler.toml; do
            if [ -f "$candidate" ]; then config_file="$candidate"; break; fi
          done
          test -n "$config_file" || { echo "Downloaded Pages config was not generated"; exit 1; }
          node scripts/prepare-pages-config.mjs "$d1_id"
          grep -q '"binding": "DB"' wrangler.jsonc
          grep -q '"binding": "FILES"' wrangler.jsonc
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '"SECURITY_MFA_ENFORCEMENT": "ENFORCE"' wrangler.jsonc
          grep -q '"SECURITY_PASSKEY_ENFORCEMENT": "ENFORCE"' wrangler.jsonc
          grep -q "\"WEBAUTHN_RP_ID\": \"${PROQPAY_CUSTOM_DOMAIN}\"" wrangler.jsonc
          grep -q "\"CANONICAL_ORIGIN\": \"https://${PROQPAY_CUSTOM_DOMAIN}\"" wrangler.jsonc
          grep -q '"API_MONITOR_RETENTION_DAYS": "180"' wrangler.jsonc

      - name: Validate resumable D1 state
        shell: bash
        run: |
          npx wrangler d1 execute proqpay-lite-production --remote \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE '_cf_%' ORDER BY name" \
            --json > /tmp/proqpay-d1-inventory.json
          node scripts/validate-d1-cutover-state.mjs /tmp/proqpay-d1-inventory.json

      - name: Export pre-deployment D1 backup
        run: npx wrangler d1 export proqpay-lite-production --remote --output=/tmp/proqpay-pre-deploy.sql --skip-confirmation

      - name: Preserve D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-d1-pre-deploy-${{ github.run_id }}
          path: /tmp/proqpay-pre-deploy.sql
          retention-days: 30

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply proqpay-lite-production --remote

      - name: Reset dedicated UAT privileged security bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROQPAY_UAT_EMAIL:-}" || { echo "PROQPAY_UAT_EMAIL is missing"; exit 1; }
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const email=String(process.env.PROQPAY_UAT_EMAIL||'').trim().toLowerCase();
          if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Invalid UAT email');
          const escaped=email.replaceAll("'","''");
          writeFileSync('/tmp/proqpay-uat-security-reset.sql', `
          UPDATE app_user_passkeys
             SET status='REVOKED',
                 revoked_at=strftime('%Y-%m-%dT%H:%M:%fZ','now'),
                 revoked_by='P4_UAT_BOOTSTRAP'
           WHERE status='ACTIVE'
             AND user_id IN (SELECT id FROM app_users WHERE lower(email)='${escaped}');
          DELETE FROM app_user_mfa
           WHERE user_id IN (SELECT id FROM app_users WHERE lower(email)='${escaped}');
          DELETE FROM app_sessions
           WHERE user_id IN (SELECT id FROM app_users WHERE lower(email)='${escaped}');
          UPDATE app_users
             SET mfa_required=1,
                 failed_login_attempts=0,
                 locked_until=NULL,
                 updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
           WHERE lower(email)='${escaped}' AND status='ACTIVE';
          INSERT INTO audit_logs(id,org_id,username,role,action,detail,entity,entity_id)
          SELECT 'AUD-' || lower(hex(randomblob(16))),org_id,email,role,
                 'UAT_SECURITY_BOOTSTRAP_RESET',
                 'Dedicated CI UAT MFA/passkey state rotated before authenticated production regression.',
                 'app_user',id
            FROM app_users
           WHERE lower(email)='${escaped}' AND status='ACTIVE';
          `);
          NODE
          npx wrangler d1 execute proqpay-lite-production --remote --file=/tmp/proqpay-uat-security-reset.sql

      - name: Seed missing employee portal credentials
        run: node scripts/seed-employee-portal-passwords.mjs

      - name: Seed fresh isolated E2Pay UAT dataset
        run: npx wrangler d1 execute proqpay-lite-production --remote --file=ops/e2pay-uat-fresh-seed.sql

      - name: Reconcile canonical payment invariants
        shell: bash
        run: |
          reconcile_sql="$(sed '/^[[:space:]]*--/d' ops/d1-reconcile.sql | tr '\n' ' ')"
          assert_sql="$(sed '/^[[:space:]]*--/d' ops/d1-cutover-assert.sql | tr '\n' ' ')"
          npx wrangler d1 execute proqpay-lite-production --remote --command="$reconcile_sql" --json > /tmp/proqpay-reconcile.json
          npx wrangler d1 execute proqpay-lite-production --remote --command="$assert_sql" --json > /tmp/proqpay-assert.json
          node -e "const x=require('/tmp/proqpay-assert.json');const rows=(Array.isArray(x)?x:[]).flatMap(v=>v.results||[]);if(rows.length){console.error(rows);process.exit(1)}"

      - name: Deploy reviewed commit to production
        run: npx wrangler pages deploy out --project-name="$PAGES_PROJECT_NAME" --branch=main --commit-hash="$RELEASE_SHA"

      - name: Verify reviewed release convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            body="$(curl --fail --silent --show-error "https://${PROQPAY_CUSTOM_DOMAIN}/release.json" 2>/dev/null || true)"
            commit="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).commit||''))}catch{}})")"
            if [ "$commit" = "$RELEASE_SHA" ]; then
              echo "Production release converged to $RELEASE_SHA."
              exit 0
            fi
            echo "Release convergence attempt ${attempt}/24: current=${commit:-unknown}, expected=$RELEASE_SHA"
            sleep 5
          done
          echo "::error::Production did not converge to reviewed commit $RELEASE_SHA."
          exit 1

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://${PROQPAY_CUSTOM_DOMAIN}/api/health > /tmp/proqpay-health.json; then
              if node -e "const x=require('/tmp/proqpay-health.json'); if(x.ready!==true||x.database!=='d1'||x.auth_mode!=='session') process.exit(1)"; then
                cat /tmp/proqpay-health.json
                exit 0
              fi
            fi
            echo "Health check attempt ${attempt}/12 is not ready yet."
            sleep 5
          done
          cat /tmp/proqpay-health.json 2>/dev/null || true
          echo "Production health check failed."
          exit 1

      - name: Verify production browser security headers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 -D /tmp/root-headers.txt -o /dev/null https://${PROQPAY_CUSTOM_DOMAIN}/               && grep -qi '^content-security-policy:' /tmp/root-headers.txt               && grep -qi "frame-ancestors 'none'" /tmp/root-headers.txt               && grep -qi "object-src 'none'" /tmp/root-headers.txt               && grep -qi '^strict-transport-security:' /tmp/root-headers.txt               && grep -qi '^cross-origin-opener-policy:[[:space:]]*same-origin' /tmp/root-headers.txt               && grep -qi '^cross-origin-resource-policy:[[:space:]]*same-origin' /tmp/root-headers.txt               && grep -qi '^x-permitted-cross-domain-policies:[[:space:]]*none' /tmp/root-headers.txt; then
              exit 0
            fi
            echo "Security header verification attempt ${attempt}/12 is not ready yet."
            sleep 5
          done
          cat /tmp/root-headers.txt || true
          exit 1

      - name: Verify production MFA enforcement
        shell: bash
        run: |
          test -n "${PROQPAY_UAT_EMAIL:-}" || { echo "PROQPAY_UAT_EMAIL is missing"; exit 1; }
          test -n "${PROQPAY_UAT_PASSWORD:-}" || { echo "PROQPAY_UAT_PASSWORD is missing"; exit 1; }
          BASE_URL="https://${PROQPAY_CUSTOM_DOMAIN}" node scripts/verify-production-mfa.mjs

      - name: Production smoke test
        shell: bash
        run: node scripts/production-smoke.mjs "https://${PROQPAY_CUSTOM_DOMAIN}"

      - name: Assert Access split (ops ≠ employee portal)
        shell: bash
        run: node scripts/assert-access-split.mjs

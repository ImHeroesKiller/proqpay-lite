name: Cloudflare Pages Production Deploy

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'proqpay-lite' }}
      PROQPAY_UAT_EMAIL: ${{ secrets.PROQPAY_UAT_EMAIL }}
      PROQPAY_UAT_PASSWORD: ${{ secrets.PROQPAY_UAT_PASSWORD }}
      PROQPAY_CUSTOM_DOMAIN: ${{ vars.PROQPAY_CUSTOM_DOMAIN || 'proqpay.msg-os.com' }}
      CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME || 'msg-os.com' }}
      D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE || 'proqpay-lite-production' }}

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Manual-dispatch quality gates
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Cloudflare native preflight
        run: npm run cloudflare:preflight

      - name: Stamp reviewed release
        shell: bash
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' "$RELEASE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/release.json

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          npx wrangler whoami

      - name: Close custom domain and WAF controls
        shell: bash
        run: node scripts/cloudflare-edge-closure.mjs

      - name: Preserve edge closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-edge-closure-${{ github.run_id }}
          path: /tmp/proqpay-edge-closure.json
          retention-days: 90
          if-no-files-found: warn


      - name: Verify production Pages project access
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages project list --json > /tmp/proqpay-pages.json
          node - <<'NODE'
          const fs=require('fs');
          const projects=JSON.parse(fs.readFileSync('/tmp/proqpay-pages.json','utf8'));
          const expected=String(process.env.PAGES_PROJECT_NAME||'').trim();
          if(!Array.isArray(projects) || !projects.some((project)=>String(project?.['Project Name'] ?? project?.name ?? '').trim()===expected)){
            console.error(`Pages project not found or inaccessible: ${expected}`);
            process.exit(1);
          }
          console.log(`Pages project access verified: ${expected}`);
          NODE

      - name: Backup production D1 before reviewed migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 export "$D1_DATABASE_NAME" --remote --output=/tmp/proqpay-d1-backup.sql
          node scripts/verify-d1-backup.mjs /tmp/proqpay-d1-backup.sql

      - name: Apply reviewed D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Verify P5.6 D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --json --command "SELECT name,type FROM sqlite_master WHERE name IN ('e2pay_disbursement_limit_requests','e2pay_disbursement_limit_usage','payment_instruction_provider_routing_immutable') ORDER BY name;" > /tmp/proqpay-p56-schema.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/proqpay-p56-schema.json','utf8'));
          const rows=(Array.isArray(payload)?payload:[payload]).flatMap((item)=>Array.isArray(item?.results)?item.results:[]);
          const names=new Set(rows.map((row)=>String(row?.name||'')));
          const required=['e2pay_disbursement_limit_requests','e2pay_disbursement_limit_usage','payment_instruction_provider_routing_immutable'];
          const missing=required.filter((name)=>!names.has(name));
          if(missing.length){
            console.error('P5.6 schema verification failed. Missing: '+missing.join(', '));
            process.exit(1);
          }
          console.log('P5.6 D1 schema verified.');
          NODE

      - name: Preserve D1 migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-d1-migration-evidence-${{ github.run_id }}
          path: |
            /tmp/proqpay-backup-verification.json
            /tmp/proqpay-p56-schema.json
          retention-days: 90
          if-no-files-found: warn

      - name: Deploy reviewed commit to production
        run: npx wrangler pages deploy out --project-name="$PAGES_PROJECT_NAME" --branch=main --commit-hash="$RELEASE_SHA"

      - name: Verify reviewed release convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            body="$(curl --fail --silent --show-error "https://${PROQPAY_CUSTOM_DOMAIN}/release.json" 2>/dev/null || true)"
            commit="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).commit||''))}catch{}})")"
            if [ "$commit" = "$RELEASE_SHA" ]; then
              echo "Production release converged to $RELEASE_SHA."
              exit 0
            fi
            echo "Release convergence attempt ${attempt}/24: current=${commit:-unknown}, expected=$RELEASE_SHA"
            sleep 5
          done
          echo "::error::Production did not converge to reviewed commit $RELEASE_SHA."
          exit 1

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://${PROQPAY_CUSTOM_DOMAIN}/api/health > /tmp/proqpay-health.json; then
              if node -e "const x=require('/tmp/proqpay-health.json'); if(x.ready!==true||x.database!=='d1'||x.auth_mode!=='session') process.exit(1)"; then
                cat /tmp/proqpay-health.json
                exit 0
              fi
            fi
            echo "Health check attempt ${attempt}/12 is not ready yet."
            sleep 5
          done
          cat /tmp/proqpay-health.json 2>/dev/null || true
          echo "Production health check failed."
          exit 1

      - name: Verify production browser security headers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 -D /tmp/root-headers.txt -o /dev/null https://${PROQPAY_CUSTOM_DOMAIN}/               && grep -qi '^content-security-policy:' /tmp/root-headers.txt               && grep -qi "frame-ancestors 'none'" /tmp/root-headers.txt               && grep -qi "object-src 'none'" /tmp/root-headers.txt               && grep -qi '^strict-transport-security:' /tmp/root-headers.txt               && grep -qi '^cross-origin-opener-policy:[[:space:]]*same-origin' /tmp/root-headers.txt               && grep -qi '^cross-origin-resource-policy:[[:space:]]*same-origin' /tmp/root-headers.txt               && grep -qi '^x-permitted-cross-domain-policies:[[:space:]]*none' /tmp/root-headers.txt; then
              exit 0
            fi
            echo "Security header verification attempt ${attempt}/12 is not ready yet."
            sleep 5
          done
          cat /tmp/root-headers.txt || true
          exit 1

      - name: Verify production MFA enforcement
        shell: bash
        run: |
          test -n "${PROQPAY_UAT_EMAIL:-}" || { echo "PROQPAY_UAT_EMAIL is missing"; exit 1; }
          test -n "${PROQPAY_UAT_PASSWORD:-}" || { echo "PROQPAY_UAT_PASSWORD is missing"; exit 1; }
          BASE_URL="https://${PROQPAY_CUSTOM_DOMAIN}" node scripts/verify-production-mfa.mjs

      - name: Production smoke test
        shell: bash
        run: node scripts/production-smoke.mjs "https://${PROQPAY_CUSTOM_DOMAIN}"

      - name: Assert Access split (ops ≠ employee portal)
        shell: bash
        run: node scripts/assert-access-split.mjs

name: Cloudflare Pages Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'proqpay-lite' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          npx wrangler whoami

      - name: Prepare production Pages and D1 configuration
        shell: bash
        run: |
          npx wrangler d1 list --json > /tmp/proqpay-d1.json
          d1_id=$(node -e "const x=require('/tmp/proqpay-d1.json');const row=x.find(v=>v.name==='proqpay-lite-production');if(!row?.uuid)process.exit(1);process.stdout.write(row.uuid)")
          npx wrangler pages download config "$PAGES_PROJECT_NAME" --force
          config_file=""
          for candidate in wrangler.jsonc wrangler.json wrangler.toml; do
            if [ -f "$candidate" ]; then config_file="$candidate"; break; fi
          done
          test -n "$config_file" || { echo "Downloaded Pages config was not generated"; exit 1; }
          node scripts/prepare-pages-config.mjs "$d1_id"
          grep -q '"binding": "DB"' wrangler.jsonc
          grep -q '"binding": "FILES"' wrangler.jsonc
          grep -q '"binding": "AI"' wrangler.jsonc

      - name: Validate resumable D1 state
        shell: bash
        run: |
          npx wrangler d1 execute proqpay-lite-production --remote \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE '_cf_%' ORDER BY name" \
            --json > /tmp/proqpay-d1-inventory.json
          node scripts/validate-d1-cutover-state.mjs /tmp/proqpay-d1-inventory.json

      - name: Export pre-deployment D1 backup
        run: npx wrangler d1 export proqpay-lite-production --remote --output=/tmp/proqpay-pre-deploy.sql --skip-confirmation

      - name: Preserve D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-d1-pre-deploy-${{ github.run_id }}
          path: /tmp/proqpay-pre-deploy.sql
          retention-days: 30

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply proqpay-lite-production --remote

      - name: Reconcile canonical payment invariants
        shell: bash
        run: |
          reconcile_sql="$(sed '/^[[:space:]]*--/d' ops/d1-reconcile.sql | tr '\n' ' ')"
          assert_sql="$(sed '/^[[:space:]]*--/d' ops/d1-cutover-assert.sql | tr '\n' ' ')"
          npx wrangler d1 execute proqpay-lite-production --remote --command="$reconcile_sql" --json > /tmp/proqpay-reconcile.json
          npx wrangler d1 execute proqpay-lite-production --remote --command="$assert_sql" --json > /tmp/proqpay-assert.json
          node -e "const x=require('/tmp/proqpay-assert.json');const rows=(Array.isArray(x)?x:[]).flatMap(v=>v.results||[]);if(rows.length){console.error(rows);process.exit(1)}"

      - name: Deploy reviewed commit to production
        run: npx wrangler pages deploy out --project-name="$PAGES_PROJECT_NAME" --branch=main --commit-hash="${{ github.sha }}"

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://proqpay-lite.pages.dev/api/health > /tmp/proqpay-health.json; then
              if node -e "const x=require('/tmp/proqpay-health.json'); if(x.ready!==true||x.database!=='d1'||x.auth_mode!=='session') process.exit(1)"; then
                cat /tmp/proqpay-health.json
                exit 0
              fi
            fi
            echo "Health check attempt ${attempt}/12 is not ready yet."
            sleep 5
          done
          cat /tmp/proqpay-health.json 2>/dev/null || true
          echo "Production health check failed."
          exit 1

name: Security Quarterly Restore Assurance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-quarterly-restore.yml'
      - 'scripts/verify-d1-backup.mjs'
  schedule:
    - cron: "37 18 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proqpay-quarterly-restore-assurance
  cancel-in-progress: false

jobs:
  restore-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          npx wrangler whoami

      - name: Export production D1
        run: npx wrangler d1 export proqpay-lite-production --remote --output=/tmp/proqpay-quarterly.sql --skip-confirmation

      - name: Restore and integrity assurance
        run: node scripts/verify-d1-backup.mjs /tmp/proqpay-quarterly.sql

      - name: Build quarterly evidence
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const verification=JSON.parse(fs.readFileSync('/tmp/proqpay-backup-verification.json','utf8'));
          const evidence={
            generatedAt:new Date().toISOString(),
            exercise:'Quarterly production D1 restore assurance',
            source:'production remote export',
            restoreVerification:verification,
            status:'PASS'
          };
          fs.writeFileSync('/tmp/proqpay-quarterly-restore-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Preserve quarterly restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: proqpay-quarterly-restore-${{ github.run_id }}
          path: |
            /tmp/proqpay-quarterly-restore-evidence.json
            /tmp/proqpay-backup-verification.json
          retention-days: 365
